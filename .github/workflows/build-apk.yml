name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set Android SDK paths
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | head -1)
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android project
        run: unzip -q "NarayaniDeviGirlsCollegeERP-GitHub-Build (1).zip" -d extracted
      - name: Build APK
        working-directory: extracted/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: narayani-erp-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
