name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: unzip -q "NarayaniDeviGirlsCollegeERP-Android-source-fixed.zip" -d extracted
      - name: Build
        working-directory: extracted/NarayaniDeviGirlsCollegeERP-Android-fixed/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: narayani-erp-debug-apk
          path: extracted/NarayaniDeviGirlsCollegeERP-Android-fixed/android/app/build/outputs/apk/debug/app-debug.apk
