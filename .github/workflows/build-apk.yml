name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set Android SDK paths
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses
      - name: Install SDK packages
        run: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android project
        run: unzip -q "NarayaniDeviGirlsCollegeERP-GitHub-Build (1).zip" -d extracted
      - name: Build APK
        working-directory: extracted/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: narayani-erp-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
